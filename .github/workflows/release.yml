name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          expected_tag="v${version}"

          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected_tag"
            exit 1
          fi

          compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${GITHUB_SHA}" --jq .status)"
          case "$compare_status" in
            behind|identical) ;;
            *)
              echo "::error::Tag commit must already be included in master (comparison status: $compare_status)"
              exit 1
              ;;
          esac

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test --reporter=verbose
      - run: pnpm run build

      - name: Verify release assets
        run: |
          test -s dist/douban-plus.user.js
          test -s dist/douban-plus.meta.js

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/douban-plus.user.js \
            dist/douban-plus.meta.js \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
