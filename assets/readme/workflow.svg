<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Douban Plus 的页面处理边界</title>
  <desc id="desc">脚本从当前豆瓣文档读取公开资料，使用页面模块和 Preact 呈现增强界面，并将登录、标记、投票和页面跳转保留在豆瓣原生流程中。</desc>
  <rect width="1200" height="330" rx="28" fill="#0c0a09"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="72" fill="#ffffff" font-size="42" font-weight="750">把页面读出来，再把观看体验重新编排</text>
    <text x="56" y="106" fill="#ffffff" fill-opacity=".58" font-size="20">增强只发生在清晰的宿主集成边界内。</text>
  </g>
  <g transform="translate(56 148)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g>
      <rect width="290" height="126" rx="16" fill="#1c1c1e" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="22" y="39" fill="#4cd97a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">01 · CURRENT DOCUMENT</text>
      <text x="22" y="80" fill="#ffffff" font-size="25" font-weight="700">读取当前公开资料</text>
      <text x="22" y="108" fill="#ffffff" fill-opacity=".54" font-size="18">不枚举、不镜像原生页面</text>
    </g>
    <path d="M306 63H366" fill="none" stroke="#4cd97a" stroke-width="3"/>
    <path d="M356 53L366 63L356 73" fill="none" stroke="#4cd97a" stroke-width="3"/>
    <g transform="translate(382)">
      <rect width="290" height="126" rx="16" fill="#1c1c1e" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="22" y="39" fill="#ffb800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">02 · PAGE MODULE</text>
      <text x="22" y="80" fill="#ffffff" font-size="25" font-weight="700">按页面语义提取与组织</text>
      <text x="22" y="108" fill="#ffffff" fill-opacity=".54" font-size="18">作品 · 图集 · 人物</text>
    </g>
    <path d="M688 63H748" fill="none" stroke="#4cd97a" stroke-width="3"/>
    <path d="M738 53L748 63L738 73" fill="none" stroke="#4cd97a" stroke-width="3"/>
    <g transform="translate(764)">
      <rect width="324" height="126" rx="16" fill="#1c1c1e" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="22" y="39" fill="#4cd97a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">03 · PREACT EXPERIENCE</text>
      <text x="22" y="80" fill="#ffffff" font-size="25" font-weight="700">沉浸式暗色阅读界面</text>
      <text x="22" y="108" fill="#ffffff" fill-opacity=".54" font-size="18">响应式，并尊重减少动态效果</text>
    </g>
  </g>
</svg>
