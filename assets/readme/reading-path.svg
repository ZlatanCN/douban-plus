<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Douban Plus 的页面边界</title>
  <desc id="desc">当前豆瓣页面的可见资料由对应页面模块提取并组织为阅读界面；账户写入和原生跳转继续交给豆瓣。</desc>
  <rect width="1200" height="360" rx="28" fill="#090a0a"/>
  <path d="M56 56H1144" stroke="#f4f0e8" stroke-opacity=".13"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="60" y="104" fill="#f8f5ee" font-size="44" font-weight="760">不复制豆瓣，把正在看的页面读得更顺。</text>
    <text x="60" y="138" fill="#f8f5ee" fill-opacity=".58" font-size="21">内容、页面模块与原生互动各有明确职责。</text>
  </g>

  <g id="reading-flow" transform="translate(60 182)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g>
      <rect width="280" height="122" rx="16" fill="#161919" stroke="#f4f0e8" stroke-opacity=".14"/>
      <path d="M22 24V98" stroke="#5dde83" stroke-width="3"/>
      <text x="42" y="42" fill="#5dde83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">01 · CURRENT PAGE</text>
      <text x="42" y="80" fill="#f8f5ee" font-size="25" font-weight="700">读取已呈现的资料</text>
      <text x="42" y="106" fill="#f8f5ee" fill-opacity=".55" font-size="18">数据不足，就保留原生页</text>
    </g>
    <path d="M288 61H320" stroke="#5dde83" stroke-width="3"/>
    <path d="M318 51L330 61L318 71" fill="none" stroke="#5dde83" stroke-width="3"/>
    <g transform="translate(340)">
      <rect width="298" height="122" rx="16" fill="#161919" stroke="#f4f0e8" stroke-opacity=".14"/>
      <path d="M22 24V98" stroke="#e9b869" stroke-width="3"/>
      <text x="42" y="42" fill="#e9b869" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">02 · PAGE MODULE</text>
      <text x="42" y="80" fill="#f8f5ee" font-size="25" font-weight="700">按路由组织阅读语义</text>
      <text x="42" y="106" fill="#f8f5ee" fill-opacity=".55" font-size="18">作品 · 短评 · 图集 · 人物</text>
    </g>
    <path d="M646 61H678" stroke="#5dde83" stroke-width="3"/>
    <path d="M676 51L688 61L676 71" fill="none" stroke="#5dde83" stroke-width="3"/>
    <g transform="translate(698)">
      <rect width="370" height="122" rx="16" fill="#161919" stroke="#f4f0e8" stroke-opacity=".14"/>
      <path d="M22 24V98" stroke="#5dde83" stroke-width="3"/>
      <text x="42" y="42" fill="#5dde83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">03 · READING EXPERIENCE</text>
      <text x="42" y="80" fill="#f8f5ee" font-size="25" font-weight="700">在原页上重排观看节奏</text>
      <text x="42" y="106" fill="#f8f5ee" fill-opacity=".55" font-size="18">登录、标记、投票与跳转由豆瓣完成</text>
    </g>
  </g>
</svg>
