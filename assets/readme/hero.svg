<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Douban Plus</title>
  <desc id="desc">为豆瓣作品、图集与人物页面提供沉浸式暗色观看界面的用户脚本。</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0c0a09"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#3b2e28"/>
      <stop offset=".55" stop-color="#d86631"/>
      <stop offset="1" stop-color="#f5bd61"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <path d="M48 56H1152M48 364H1152" stroke="#ffffff" stroke-opacity=".12"/>
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="92" fill="#4cd97a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">DOUBAN USER SCRIPT · V1.6</text>
    <text x="64" y="174" font-size="66" font-weight="750" letter-spacing="-2">Douban Plus</text>
    <text x="64" y="218" fill="#ffffff" fill-opacity=".74" font-size="26">给作品、图集与人物页一套更好的观看界面</text>
    <text x="64" y="266" fill="#ffffff" fill-opacity=".54" font-size="20">在当前豆瓣页面上读取公开资料，再由 Preact 重组。</text>
    <text x="64" y="296" fill="#ffffff" fill-opacity=".54" font-size="20">链接、登录、标记和投票仍留在豆瓣的原生边界内。</text>
  </g>

  <g transform="translate(696 48)">
    <rect width="440" height="284" rx="20" fill="#090909" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="18" y="18" width="404" height="38" rx="10" fill="#ffffff" fill-opacity=".06"/>
    <circle cx="39" cy="37" r="6" fill="#4cd97a"/>
    <text x="58" y="43" fill="#ffffff" fill-opacity=".62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">CURRENT PAGE → RECOMPOSED</text>

    <g transform="translate(18 74)">
      <rect width="116" height="176" rx="12" fill="url(#poster)"/>
      <path d="M0 132C30 95 72 154 116 92V176H0Z" fill="#171212" fill-opacity=".55"/>
      <text x="14" y="156" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">作品页</text>
      <rect x="138" width="128" height="176" rx="12" fill="#1c1c1e"/>
      <g fill="#ffffff" fill-opacity=".2">
        <rect x="151" y="14" width="45" height="62" rx="7"/>
        <rect x="204" y="14" width="49" height="38" rx="7"/>
        <rect x="151" y="84" width="43" height="78" rx="7"/>
        <rect x="202" y="60" width="51" height="102" rx="7"/>
      </g>
      <rect x="151" y="14" width="45" height="62" rx="7" fill="#4cd97a" fill-opacity=".26"/>
      <text x="151" y="156" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">图集</text>
      <rect x="270" width="152" height="176" rx="12" fill="#1c1c1e"/>
      <circle cx="305" cy="41" r="22" fill="#ffffff" fill-opacity=".3"/>
      <rect x="338" y="23" width="66" height="12" rx="6" fill="#fff" fill-opacity=".76"/>
      <rect x="338" y="46" width="48" height="9" rx="4.5" fill="#fff" fill-opacity=".35"/>
      <path d="M292 92H407M292 122H407" stroke="#fff" stroke-opacity=".14"/>
      <path d="M303 92V122" stroke="#4cd97a" stroke-width="3"/>
      <text x="287" y="156" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">人物页</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
    <text x="64" y="340" fill="#ffb800">PUBLIC DATA</text>
    <path d="M206 334H286" stroke="#4cd97a" stroke-width="2"/>
    <text x="304" y="340" fill="#ffffff" fill-opacity=".56">EXTRACT</text>
    <path d="M395 334H475" stroke="#4cd97a" stroke-width="2"/>
    <text x="493" y="340" fill="#ffffff" fill-opacity=".56">PRESENT</text>
  </g>
</svg>
