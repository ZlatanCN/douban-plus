<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Douban Plus</title>
  <desc id="desc">为豆瓣作品、短评、图集与人物页重新编排连续的暗色观看体验。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#090a0a"/>
      <stop offset="1" stop-color="#151312"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#26332c"/>
      <stop offset="1" stop-color="#111817"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <path d="M56 54H1144M56 336H1144" stroke="#f4f0e8" stroke-opacity=".13"/>
  <path d="M56 54V336" stroke="#f4f0e8" stroke-opacity=".08"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="84" y="96" fill="#5dde83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">DOUBAN · READING RECOMPOSED</text>
    <text x="80" y="177" fill="#f8f5ee" font-size="68" font-weight="760" letter-spacing="-2.4">Douban Plus</text>
    <text x="84" y="222" fill="#f8f5ee" fill-opacity=".82" font-size="28" font-weight="600">让一部作品，从资料到社区，读成一条路径。</text>
    <text x="84" y="268" fill="#f8f5ee" fill-opacity=".56" font-size="21">作品 · 短评 · 图集 · 演职员 · 人物</text>
    <g transform="translate(84 304)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
      <text fill="#5dde83">CURRENT PAGE</text>
      <path d="M156 -6H216" stroke="#5dde83" stroke-width="2"/>
      <text x="236" fill="#f8f5ee" fill-opacity=".62">READING PATH</text>
    </g>
  </g>

  <g id="route-specimen" transform="translate(718 62)">
    <rect width="398" height="236" rx="20" fill="#0d0f0f" stroke="#f4f0e8" stroke-opacity=".16"/>
    <rect x="18" y="18" width="362" height="34" rx="9" fill="#f4f0e8" fill-opacity=".06"/>
    <circle cx="37" cy="35" r="5" fill="#5dde83"/>
    <text x="55" y="41" fill="#f8f5ee" fill-opacity=".66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">ONE PAGE · FOUR READING MODES</text>

    <g transform="translate(18 72)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <rect width="108" height="132" rx="13" fill="url(#screen)"/>
      <path d="M14 92C36 63 64 106 94 72" fill="none" stroke="#5dde83" stroke-opacity=".66" stroke-width="3"/>
      <rect x="14" y="15" width="36" height="52" rx="7" fill="#e9b869" fill-opacity=".76"/>
      <rect x="59" y="16" width="34" height="10" rx="5" fill="#f8f5ee" fill-opacity=".77"/>
      <rect x="59" y="34" width="26" height="8" rx="4" fill="#f8f5ee" fill-opacity=".33"/>
      <text x="14" y="116" fill="#f8f5ee" font-size="20" font-weight="700">作品</text>

      <g transform="translate(122)">
        <rect width="108" height="132" rx="13" fill="#171a1a"/>
        <path d="M14 35H94M14 62H94M14 89H72" stroke="#f8f5ee" stroke-opacity=".24" stroke-width="7" stroke-linecap="round"/>
        <circle cx="19" cy="35" r="4" fill="#5dde83"/>
        <circle cx="19" cy="62" r="4" fill="#5dde83"/>
        <text x="14" y="116" fill="#f8f5ee" font-size="20" font-weight="700">短评</text>
      </g>

      <g transform="translate(244)">
        <rect width="118" height="132" rx="13" fill="#171a1a"/>
        <rect x="14" y="14" width="38" height="44" rx="6" fill="#f8f5ee" fill-opacity=".22"/>
        <rect x="59" y="14" width="45" height="28" rx="6" fill="#5dde83" fill-opacity=".5"/>
        <rect x="59" y="49" width="45" height="45" rx="6" fill="#e9b869" fill-opacity=".42"/>
        <rect x="14" y="65" width="38" height="29" rx="6" fill="#f8f5ee" fill-opacity=".12"/>
        <text x="14" y="116" fill="#f8f5ee" font-size="20" font-weight="700">图集 / 人物</text>
      </g>
    </g>
  </g>
</svg>
